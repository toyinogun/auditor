ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Native and binary packages allowed to run their install scripts.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Run every pnpm command in this project on Node 22 (matches .nvmrc, engines and the Docker image),
# whatever Node the shell has. pnpm downloads it on first use.
useNodeVersion: 22.23.3
